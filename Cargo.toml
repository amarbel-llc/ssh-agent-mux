[package]
name = "ssh-agent-mux"
description = "Combine keys from multiple SSH agents into a single agent socket"
repository = "https://github.com/overhacked/ssh-agent-mux"
license = "Apache-2.0 OR BSD-3-Clause"
keywords = ["ssh", "ssh-agent", "authentication"]
categories = ["command-line-utilities", "network-programming"]
exclude = [".*"]
version = "0.1.2"
edition = "2024"
rust-version = "1.85.0"

[dependencies]
clap-serde-derive = "0.2.1"
expand-tilde = "0.6.0"
flexi_logger = "0.30.1"
serde_json = "1.0"
shellexpand = "3.1.0"
ssh-agent-lib = { git = "https://github.com/amarbel-llc/ssh-agent-lib.git", branch = "master" }
tap-dancer = { git = "https://github.com/amarbel-llc/tap.git", tag = "v0.1.13", version = "0.1.13" }
tempfile = "3.20.0"
toml = "0.8.22"

[dependencies.color-eyre]
version = "0.6.3"
default-features = false
features = ["track-caller"]

[dependencies.log]
version = "0.4.27"
features = ["std"]

[dependencies.serde]
version = "1.0.145"
features = ["derive"]

[dependencies.tokio]
version = "1.45.0"
features = ["rt", "macros", "signal", "sync", "net", "time", "process"]

[dev-dependencies]
duct = "1.0.0"
